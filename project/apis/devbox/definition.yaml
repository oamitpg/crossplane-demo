apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: devboxes.platform.slashdir.net
spec:
  scope: Namespaced
  group: platform.slashdir.net
  names:
    kind: DevBox
    plural: devboxes
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: string
                  description: T-shirt size of the box.
                  enum: [small, medium, large]
                  default: small
                node:
                  type: string
                  description: Proxmox node to create the box on.
                  default: pve1
                hostname:
                  type: string
                  description: Hostname inside the box. Defaults to the DevBox name.
            status:
              type: object
              properties:
                size:
                  type: string
