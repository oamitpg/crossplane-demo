# Production overrides, merged over app-config.yaml. Everything environment-specific comes from env vars
# (set in ../deploy/backstage.yaml); secrets come from the `backstage-secrets` Secret, never from git.
app:
  title: Lab DevBox Portal
  baseUrl: ${BACKSTAGE_BASE_URL}

organization:
  name: Lab

backend:
  baseUrl: ${BACKSTAGE_BASE_URL}
  listen: ':7007'
  cors:
    origin: ${BACKSTAGE_BASE_URL}
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

auth:
  environment: development
  providers:
    github:
      development:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            # Lab only: anyone who can sign in with GitHub gets an identity user:default/<github login>,
            # even without a User entity in the catalog. Restrict this before exposing the portal widely.
            - resolver: usernameMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true

# TechDocs: the backend builds each entity's mkdocs site on demand (mkdocs is installed in the image, so no Docker-in-Docker),
# reading sources from GitHub via the techdocs-ref annotation. Output lives in the pod and is rebuilt after a restart.
techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: local
    local:
      publishDirectory: /tmp/techdocs

# Live status of DevBoxes. Backstage runs in the cluster it reads, so with authProvider serviceAccount and no token it
# uses the pod's own service account (RBAC in backstage/deploy/rbac.yaml).
kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: kind-crossplane
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
  customResources:
    - group: platform.slashdir.net
      apiVersion: v1alpha1
      plural: devboxes

# Sync/health of the Argo CD Application behind an entity. ARGOCD_AUTH_TOKEN is a read-only API key (bootstrap/argocd-rbac.yaml).
# argocd-server runs with server.insecure, so plain http inside the cluster is fine.
argocd:
  appLocatorMethods:
    - type: config
      instances:
        - name: primary
          url: http://argocd-server.argocd.svc.cluster.local
          token: ${ARGOCD_AUTH_TOKEN}

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Template]
  locations:
    - type: url
      target: https://github.com/oamitpg/crossplane-demo/blob/main/backstage/templates/*/template.yaml
      rules:
        - allow: [Template]
    # Every ordered DevBox has an entity file here; the catalog picks them up by glob.
    - type: url
      target: https://github.com/oamitpg/crossplane-demo/blob/main/backstage/catalog/devboxes/*.yaml
      rules:
        - allow: [Resource]
    # Fictional field-command landscape: domain, systems and owning units...
    - type: url
      target: https://github.com/oamitpg/crossplane-demo/blob/main/backstage/catalog/army/landscape.yaml
      rules:
        - allow: [Domain, System, Group]
    # ...and one Component per service; the deploy-army-service template adds a file here for each new one.
    - type: url
      target: https://github.com/oamitpg/crossplane-demo/blob/main/backstage/catalog/services/*.yaml
      rules:
        - allow: [Component]
    # Demo landscape for the catalog graph
    - type: url
      target: https://github.com/oamitpg/crossplane-demo/blob/main/backstage/catalog/demo/lab-shop.yaml
      rules:
        - allow: [Domain, System, Group, User, API, Component, Resource]
