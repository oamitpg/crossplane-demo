apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: lima
  description: "Forecasts ration needs for deployed units."
  annotations:
    backstage.io/source-location: url:https://github.com/oamitpg/crossplane-demo/tree/main/services/lima/
    backstage.io/kubernetes-id: lima
    backstage.io/kubernetes-namespace: army-services
    argocd/instance-name: primary
    argocd/app-name: svc-lima
    argocd/app-namespace: argocd
spec:
  type: service
  lifecycle: experimental
  owner: group:default/logistics-corps
  system: system:default/logistics
  dependsOn:
    - component:default/delta
