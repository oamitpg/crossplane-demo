apiVersion: platform.slashdir.net/v1alpha1
kind: DevBox
metadata:
  name: ${{ values.name }}
  namespace: devboxes
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    devbox.slashdir.net/requested-by: ${{ values.requestedBy }}
spec:
  size: ${{ values.size }}
  node: ${{ values.node }}
