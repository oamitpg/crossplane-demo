apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{ values.name }}
  description: DevBox ${{ values.name }} - ${{ values.size }} LXC container on Proxmox node ${{ values.node }}
  tags:
    - devbox
    - ${{ values.size }}
  annotations:
    backstage.io/source-location: url:https://github.com/oamitpg/crossplane-demo/tree/main/devboxes/
  links:
    - title: DevBox manifest in git
      url: https://github.com/oamitpg/crossplane-demo/blob/main/devboxes/${{ values.name }}.yaml
spec:
  type: devbox
  owner: user:default/${{ values.requestedBy }}
  lifecycle: experimental
