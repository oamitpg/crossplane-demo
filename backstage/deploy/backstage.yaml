# The portal. The image is built locally and loaded into kind (see README), so it is never pulled.
# Secret `backstage-secrets` (created by hand, see backstage/secret.yaml.tmpl) provides:
#   POSTGRES_USER, POSTGRES_PASSWORD, GITHUB_TOKEN, AUTH_GITHUB_CLIENT_ID, AUTH_GITHUB_CLIENT_SECRET, ARGOCD_AUTH_TOKEN
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: backstage
spec:
  selector:
    app: backstage
  ports:
    - name: http
      port: 7007
      targetPort: 7007
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      serviceAccountName: backstage
      containers:
        - name: backstage
          image: lab/backstage:0.1.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7007
              name: http
          env:
            - name: BACKSTAGE_BASE_URL
              value: https://7007--main--scarlet-gazelle-82--oaaler.slashdir.net
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: backstage-secrets
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
