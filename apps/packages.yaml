apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: packages
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: ssh://git@github.com/oamitpg/crossplane-demo.git
    targetRevision: main
    path: packages
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
